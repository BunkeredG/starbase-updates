name: Scrape Launch & Closure Data

on:
  # schedule:
  #   - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: install dependencies
        run: pip install requests beautifulsoup4

      - name: run scrapers
        run: |
          python scrape_closures.py
          python scrape_launches.py

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add launches.json closures.json
          git diff --staged --quiet || git commit -m "automated scrape ($(date -u +'%H:%M'))"
          git push